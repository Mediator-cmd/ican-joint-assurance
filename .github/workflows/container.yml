name: Publish container

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v3
        with:
          registry: crpi-hv15il2f9akxr63b.cn-hangzhou.personal.cr.aliyuncs.com
          username: nick4021154231
          password: ${{ secrets.ACR_REGISTRY_PASSWORD }}
      - id: metadata
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/mediator-cmd/ican-joint-assurance
            crpi-hv15il2f9akxr63b.cn-hangzhou.personal.cr.aliyuncs.com/lzflyg/ican-joint-assurance-runtime
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
