      <path d="M0 36V-26M-12-12L0-26 12-12" stroke="#aa8d45" stroke-width="2"/>
      <path d="M-29 28H29" stroke="#b9c1bd" stroke-width="1"/>
    </g>
    <g id="service-bay">
      <rect width="32" height="16" fill="#f7f8f6" stroke="#9ca7a2"/>
      <path d="M8 0V16M16 0V16M24 0V16" stroke="#c0c7c3"/>
    </g>
  </defs>

  <rect width="1000" height="620" fill="#eef1ef"/>
  <rect width="1000" height="620" fill="url(#map-grid)"/>

