<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title description">
  <title id="title">Anonymous teaching-simulation airport operations layout</title>
  <desc id="description">Original fictional airport diagram with runway, apron, terminal concourses, gate stands, service roads and ground-support staging areas.</desc>

  <defs>
    <pattern id="map-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#66736d" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>
    <pattern id="apron-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#7f8b86" stroke-opacity="0.12" stroke-width="1"/>
      <circle cx="1" cy="1" r="1" fill="#6f7d77" fill-opacity="0.16"/>
    </pattern>
    <pattern id="restricted-hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="12" height="12" fill="#e6e9e6"/>
      <rect width="3" height="12" fill="#c9cfcc" fill-opacity="0.54"/>
    </pattern>
    <pattern id="terminal-floor" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M18 0H0V18" fill="none" stroke="#c4ccc8" stroke-opacity="0.36" stroke-width="1"/>
    </pattern>
    <g id="stand-marking" fill="none">
